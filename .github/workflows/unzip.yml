name: Unzip backend
on:
  push:
    branches: [main]
    paths: ['dental-clinic-v3-backend.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit files
        run: |
          test -f dental-clinic-v3-backend.zip || exit 0
          unzip -o dental-clinic-v3-backend.zip
          mv dental-clinic-v3-backend/* .
          rmdir dental-clinic-v3-backend
          rm dental-clinic-v3-backend.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract backend files [skip ci]" || exit 0
          git push
